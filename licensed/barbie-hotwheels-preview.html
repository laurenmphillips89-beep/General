<title>Barbie &amp; Hot Wheels Pages</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: one licensed landing page per IP (hero, range grid, kit spotlight, product page, FAQ), switched by the tabs.
   Each IP swaps the colour tokens only. Nourish fonts, voice and Forest Green footer stay, so it still feels like our store.
   Single bright look on purpose: these are retail pages for the licensor's palette, so no dark mode. */
:root{
  color-scheme: light;
  --forest:#2B4325; --leaf:#C7E7AF; --butter:#FFF9DA;
  --ink:#2A1A22; --muted:#6B5560; --surface:#FFFFFF;
  /* Barbie: Pantone 219 C is the hero pink. Tints are ours, to check against the Mattel style guide */
  --p1:#DA1884;   /* Pantone 219 C, CTAs and headings */
  --p2:#F7A8CE;   /* soft pink, pills and card borders */
  --p3:#FDE7F1;   /* blush, page background */
  --p4:#FFFFFF;   /* card surface */
  --p5:#7A0E4A;   /* deep berry, text on pink */
  --accent:#9AD1D4; /* Bath Teal stays as our bath accent */
  --display:"Playfair Display", Georgia, serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
body[data-ip="hotwheels"]{
  /* Hot Wheels: flame orange + racing blue + yellow. Approximations, swap in style-guide Pantones */
  --p1:#FF5F00;   /* flame orange, CTAs */
  --p2:#FFD100;   /* Pantone 109 C yellow, pills */
  --p3:#EAF2FF;   /* sky track, page background */
  --p4:#FFFFFF;
  --p5:#0B2C6B;   /* racing blue, headings and text */
  --ink:#0E1A33; --muted:#4A5878;
}
*{box-sizing:border-box}
body{margin:0;background:var(--p3);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;transition:background .3s}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.15;margin:0;text-wrap:balance;color:var(--p5)}
p{margin:0}
.band{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.in{max-width:1180px;margin:0 auto}

/* Switcher + notes for Lauren */
.bar{background:var(--forest);color:var(--butter);padding-block:14px}
.bar .in{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.bar b{font-family:var(--display);font-weight:500;font-size:18px}
.tabs{display:flex;gap:6px;background:rgba(255,249,218,.12);padding:4px;border-radius:999px}
.tabs button{font:800 14px var(--body);border:0;border-radius:999px;padding:8px 18px;cursor:pointer;background:transparent;color:var(--butter)}
.tabs button[aria-selected="true"]{background:var(--butter);color:var(--forest)}
.tabs button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.note{background:var(--butter);color:var(--forest);font-size:14px;padding-block:10px;border-bottom:1px solid #E6E8D6}
.note .in{display:flex;flex-wrap:wrap;gap:6px 18px}
.note span::before{content:"✎ ";font-weight:900}

/* Hero */
.hero{padding-block:48px 56px}
.hero .in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
.lockup{display:inline-flex;align-items:center;gap:10px;background:var(--p4);border:2px solid var(--p2);border-radius:999px;padding:6px 8px 6px 16px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--p5)}
.lockup i{font-style:normal;display:inline-grid;place-items:center;background:var(--p1);color:#fff;border-radius:999px;padding:4px 12px;font-size:11px;letter-spacing:.04em}
.hero h1{font-size:clamp(34px,5.4vw,58px);margin-top:18px}
.hero h1 em{font-style:italic;color:var(--p1)}
.hero .sub{font-size:18px;max-width:52ch;margin-top:14px;color:var(--muted)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{font:900 16px var(--body);text-decoration:none;border-radius:999px;padding:14px 26px;border:2.5px solid var(--p1);background:var(--p1);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--p5)}
.btn.ghost{background:transparent;color:var(--p5);border-color:var(--p5)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding:0;list-style:none}
.pills li{background:var(--p2);color:var(--p5);font-weight:800;font-size:13px;border-radius:999px;padding:6px 14px}
body[data-ip="hotwheels"] .pills li{color:var(--ink)}

/* Product art: CSS crayons standing in for photos */
.art{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:32px;background:var(--p4);border:3px solid var(--p2);box-shadow:10px 10px 0 var(--p1);display:grid;place-items:center;overflow:hidden}
.art .tag{position:absolute;left:16px;bottom:14px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sticks{display:flex;gap:6%;align-items:flex-end;height:62%;width:70%}
.sticks span{flex:1;border-radius:40% 40% 14px 14px;height:var(--h)}
.logo-slot{position:absolute;top:16px;right:16px;border:2px dashed var(--p2);border-radius:12px;padding:6px 10px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--p4)}

/* Range grid */
section.block{padding-block:56px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:26px}
.head h2{font-size:clamp(28px,3.6vw,40px)}
.head p{color:var(--muted);max-width:48ch}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--p1);display:block;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{background:var(--p4);border:2.5px solid var(--p2);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card .art{border-radius:18px;box-shadow:none;border:0;background:var(--p3)}
.card .made{align-self:flex-start;font-size:11.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:var(--leaf);color:var(--forest)}
.card .made.alt{background:#EEE7EB;color:var(--muted)}
body[data-ip="hotwheels"] .card .made.alt{background:#E2E8F3}
.card h3{font-size:21px}
.card p{font-size:15px;color:var(--muted);flex:1}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.price{font-weight:900;font-size:18px;color:var(--p5);font-variant-numeric:tabular-nums}
.card .btn{padding:10px 18px;font-size:14px}

/* Kit spotlight */
.kit{background:var(--p5);color:#fff;border-radius:32px;padding:40px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:36px;align-items:center}
.kit h2{color:#fff;font-size:clamp(28px,3.6vw,42px)}
.kit h2 em{color:var(--p2);font-style:italic}
.kit p{color:rgba(255,255,255,.86);margin-top:12px;max-width:50ch}
.kit ul{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.kit li{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 14px}
.kit li b{display:block}
.kit li small{color:rgba(255,255,255,.75);font-size:14px}
.kit .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--p2);color:var(--p5);display:grid;place-items:center;font-weight:900}
.kit .btn{margin-top:22px;background:var(--p2);border-color:var(--p2);color:var(--p5)}
.kit .art{box-shadow:10px 10px 0 var(--p2);border-color:var(--p2)}

/* Why parents love it */
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.why div{background:var(--p4);border-radius:22px;padding:20px;border:2px solid var(--p2)}
.why b{display:block;font-family:var(--display);font-weight:500;font-size:20px;color:var(--p5);margin-bottom:6px}
.why p{font-size:15px;color:var(--muted)}
.quote{margin-top:22px;background:var(--accent);border-radius:22px;padding:22px 26px;color:var(--forest);display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.quote p{font-family:var(--display);font-size:20px;font-style:italic;max-width:60ch}
.quote span{font-weight:800;font-size:14px}

/* Product page mock */
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;background:var(--p4);border-radius:32px;padding:32px;border:2.5px solid var(--p2)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.thumbs span{aspect-ratio:1/1;border-radius:14px;background:var(--p3);border:2px solid var(--p2)}
.thumbs span:first-child{border-color:var(--p1)}
.pdp .crumbs{font-size:13px;color:var(--muted);font-weight:700}
.pdp h3{font-size:clamp(28px,3.4vw,38px);margin-top:6px}
.stars{color:var(--p1);font-weight:900;font-size:15px;margin-top:6px}
.stars small{color:var(--muted);font-weight:700}
.pdp .price{font-size:26px;margin-top:10px}
.pdp .lede{margin-top:10px;color:var(--muted)}
.ticks{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.ticks li{display:flex;gap:10px;align-items:baseline}
.ticks li::before{content:"✓";font-weight:900;color:var(--p1)}
.buy{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}
.qty{display:inline-flex;align-items:center;border:2.5px solid var(--p2);border-radius:999px;font-weight:900}
.qty span{padding:10px 16px;font-variant-numeric:tabular-nums}
.ship{margin-top:14px;font-size:14px;font-weight:700;color:var(--forest);background:var(--leaf);border-radius:14px;padding:10px 14px}
details{border-top:2px solid var(--p3);padding-block:12px}
details:first-of-type{margin-top:18px}
summary{cursor:pointer;font-weight:900;color:var(--p5);list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details p{margin-top:8px;color:var(--muted);font-size:15px}

/* FAQ + footer */
.faq{max-width:820px}
.faq details{background:var(--p4);border:2px solid var(--p2);border-radius:18px;padding:14px 20px;margin-top:10px}
.faq details:first-of-type{margin-top:0}
.legal{background:var(--forest);color:var(--leaf);padding-block:28px;font-size:13.5px}
.legal .in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

@media (max-width:960px){
  .hero .in,.kit,.pdp{grid-template-columns:minmax(0,1fr)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .why{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .art{max-width:420px}
}
@media (max-width:560px){
  .grid,.why{grid-template-columns:minmax(0,1fr)}
  .kit,.pdp{padding:22px;border-radius:24px}
  .hero{padding-block:32px 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="bar band"><div class="in">
  <b>Licensed range preview</b>
  <div class="tabs" role="tablist" aria-label="Choose a range">
    <button id="tab-barbie" role="tab" data-ip="barbie" aria-selected="true">Barbie™</button>
    <button id="tab-hotwheels" role="tab" data-ip="hotwheels" aria-selected="false">Hot Wheels™</button>
  </div>
</div></div>
<div class="note band"><div class="in">
  <span>Prices, photos and official logos are placeholders</span>
  <span>Colours are Pantone matches to confirm against the Mattel style guide</span>
  <span>Kits: crayons, mat, bath rocks, plus colouring book (confirm)</span>
</div></div>

<main id="page"></main>

<footer class="legal band"><div class="in">
  <span id="legal-line"></span>
  <span>Nourish by Nature · Handmade in Sydney 🛁</span>
</div></footer>

<script>
const IP = {
  barbie: {
    name: "Barbie™",
    lockup: "Barbie™ × Nourish by Nature",
    h1: 'Bath time, but make it <em>Barbie.</em>',
    sub: "Pink bubbles, dreamy colours and zero mess on the tiles. Our hand-poured beeswax crayons and bath fun, now in official Barbie designs for little dreamers.",
    pills: ["Hand-poured in Sydney", "Food-grade pigments", "Washes off with water", "Official Barbie™ licence"],
    sticks: ["#DA1884","#F7A8CE","#9AD1D4","#FFD6E8","#B5126C"],
    rangeTitle: "The Barbie™ range",
    rangeSub: "Six ways to bring a little pink into bath time and play time. Mix, match, or grab the kits for gifting.",
    products: [

const heights = ["70%","92%","58%","84%","66%"];
function art(colors, label, logo){
  return `<div class="art">${logo ? '<span class="logo-slot">Official logo</span>' : ''}
    <div class="sticks">${colors.map((c,i)=>`<span style="background:${c};--h:${heights[i%5]}"></span>`).join("")}</div>

}

function render(key){
  const d = IP[key];
  document.body.dataset.ip = key;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.ip===key));

  document.getElementById("page").innerHTML = `

    </div>
    ${art(d.sticks,"Hero lifestyle photo",true)}
  </div></section>

  <section class="block band" id="range" style="padding-top:8px"><div class="in">

    <div class="grid">${d.products.map((p,i)=>`
      <article class="card">
        ${art(rot(d.sticks,i),"Product photo",false)}
        <span class="made ${p.local?'':'alt'}">${p.made}</span>
        <h3>${p.n}</h3><p>${p.d}</p>
        <div class="foot"><span class="price">$TBC</span><button class="btn" type="button">Add to cart</button></div>

  </div></section>

  <section class="band" id="kit"><div class="in">
    <div class="kit">
      ${art(rot(d.sticks,2),"Kit flat-lay photo",true)}
      <div>
        <span class="eyebrow" style="color:var(--p2)">The perfect gift</span>
        <h2>${d.kitName}</h2>
        <p>${d.kitSub}</p>
        <ul>${kitBits.map((k,i)=>`<li><span class="num">${i+1}</span><div><b>${k[0]}</b><small>${k[1]}</small></div></li>`).join("")}</ul>

    <div class="why">
      <div><b>Safe for little hands</b><p>Natural beeswax blend and food-grade pigments. Non-toxic and tested for Aussie families.</p></div>
      <div><b>Mess-free (promise)</b><p>Bath crayons wash off with water. Mats wipe clean. Your grout stays your grout.</p></div>
      <div><b>Handmade in Sydney</b><p>Our crayons are hand-poured in small batches in Sydney. Not mass-produced, not generic.</p></div>
      <div><b>Gift-ready</b><p>The kits arrive in a box that's ready to wrap. Party invite on Saturday? Easy.</p></div>
    </div>
    <div class="quote"><p>${d.quote.q}</p><span>${d.quote.by}</span></div>
  </div></section>

  <section class="block band" style="padding-top:0"><div class="in">

      <div>${art(d.sticks,"Main product photo",true)}<div class="thumbs"><span></span><span></span><span></span><span></span></div></div>
